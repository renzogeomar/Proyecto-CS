[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modelador-3fn"
version = "0.1.0"
description = "Modelado relacional a partir de requisitos y auditoría de 3FN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
modelador = "modelador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
