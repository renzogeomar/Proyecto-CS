[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modelador-3fn"
version = "0.1.0"
description = "Modelado relacional a partir de requisitos y auditoría de 3FN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "psycopg[binary]",
    "httpx",
]
dev = ["pytest", "ruff"]

[project.scripts]
modelador = "modelador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
